<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html, body { margin: 0; height: 100%; background: #2b2b2b; overflow: hidden; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    #unity-canvas { display: block; background: #2b2b2b; outline: none; }
    #loading { position: absolute; left: 50%; top: 50%; width: 40%; height: 14px; transform: translate(-50%, -50%);
      border: 2px solid #f3ead7; }
    #bar { width: 0; height: 100%; background: #f3ead7; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
  <div id="loading"><div id="bar"></div></div>
  <script>
    // Oyun 16:9 tasarlandi: tuval, sayfa ya da cerceve boyutu ne olursa olsun bu orani korur.
    var canvas = document.getElementById("unity-canvas");
    function fit() {
      var scale = Math.min(window.innerWidth / 16, window.innerHeight / 9);
      canvas.style.width = Math.floor(16 * scale) + "px";
      canvas.style.height = Math.floor(9 * scale) + "px";
    }
    window.addEventListener("resize", fit);
    fit();

    var script = document.createElement("script");
    script.src = "Build/{{{ LOADER_FILENAME }}}";
    script.onload = function () {
      createUnityInstance(canvas, {
        dataUrl: "Build/{{{ DATA_FILENAME }}}",
        frameworkUrl: "Build/{{{ FRAMEWORK_FILENAME }}}",
        codeUrl: "Build/{{{ CODE_FILENAME }}}",
        streamingAssetsUrl: "StreamingAssets",
        companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
        productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
        productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}}
      }, function (progress) {
        document.getElementById("bar").style.width = 100 * progress + "%";
      }).then(function () {
        document.getElementById("loading").style.display = "none";
        canvas.focus();
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
